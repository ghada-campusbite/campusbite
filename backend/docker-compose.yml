services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campusbite
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: campusbite
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://campusbite:${DB_PASSWORD}@db:5432/campusbite
    depends_on: [db]
    ports: ["3000:3000"]
volumes:
  pgdata:
